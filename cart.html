<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StyledByLade | Cart</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">StyledByLade</div>
        <nav>
            <a href="index.html">HOME</a>
            <a href="shop.html">SHOP</a>
            <a href="cart.html" class="active">CART <span class="cart-count" id="cartCount">0</span></a>
        </nav>
    </header>

    <section class="section">
        <p class="section-tag">✦ Your Cart ✦</p>
        <h2>Shopping Cart</h2>
        <div id="cartItems" class="cart-items"></div>
        
        <div class="cart-total">
            <strong>Total: <span id="total">₦0</span></strong>
        </div>

        <!-- Customer Details Form -->
        <div id="customerDetails" style="max-width: 700px; margin: 3rem auto; background: white; padding: 2rem; border-radius: 12px; display: none;">
            <h3 style="margin-bottom: 1.5rem;">Delivery Information</h3>
            <form id="deliveryForm">
                <label>Full Name *</label>
                <input type="text" id="fullName" required style="width:100%; padding:12px; margin:8px 0; border:1px solid #ddd; border-radius:8px;">

                <label>Phone Number *</label>
                <input type="tel" id="phoneNumber" required style="width:100%; padding:12px; margin:8px 0; border:1px solid #ddd; border-radius:8px;">

                <label>Delivery Address *</label>
                <textarea id="address" required rows="3" style="width:100%; padding:12px; margin:8px 0; border:1px solid #ddd; border-radius:8px;"></textarea>

                <label>Additional Notes (Optional)</label>
                <textarea id="notes" rows="2" style="width:100%; padding:12px; margin:8px 0; border:1px solid #ddd; border-radius:8px;"></textarea>

                <button type="button" onclick="proceedToWhatsApp()" class="btn-gold" style="width:100%; margin-top:1.5rem; padding:1rem;">
                    Send Order to WhatsApp
                </button>
            </form>
        </div>

        <div style="text-align:center; margin-top:2rem;">
            <button onclick="showDeliveryForm()" class="btn-gold" style="padding:1rem 3rem; font-size:1.1rem;">Checkout via WhatsApp</button>
            <button onclick="clearCart()" style="margin-left:1rem; background:#ccc; color:#333;">Clear Cart</button>
        </div>
    </section>

    <footer>
        © 2026 StyledByLade — All Rights Reserved | Lagos, Nigeria
    </footer>

    <script src="cart-script.js"></script>
    <script>
        renderCart();
        updateCartCount();
    </script>
</body>
</html>
