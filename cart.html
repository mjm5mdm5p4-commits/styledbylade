<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StyledByLade | Cart</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">StyledByLade</div>
        <nav>
            <a href="index.html">HOME</a>
            <a href="shop.html">SHOP</a>
            <a href="cart.html" class="active">CART <span class="cart-count" id="cartCount">0</span></a>
        </nav>
    </header>

    <section class="section">
        <p class="section-tag">✦ Your Cart ✦</p>
        <h2>Shopping Cart</h2>
        <div id="cartItems" class="cart-items"></div>
        
        <div class="cart-total">
            <strong>Total: <span id="total">₦0</span></strong>
        </div>

        <div style="text-align:center; margin-top:2rem;">
            <button onclick="checkoutWhatsApp()" class="btn-gold" style="padding:1rem 3rem; font-size:1.1rem;">Checkout via WhatsApp</button>
            <button onclick="clearCart()" style="margin-left:1rem; background:#ccc; color:#333;">Clear Cart</button>
        </div>
    </section>

    <footer>
        © 2026 StyledByLade — All Rights Reserved | Lagos, Nigeria
    </footer>

    <script src="cart-script.js"></script>
    <script>
        renderCart();
        updateCartCount();
    </script>
</body>
</html>
