<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StyledByLade | Cart</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        #customerDetails {
            max-width: 700px;
            margin: 3rem auto;
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        #customerDetails label {
            display: block;
            margin: 15px 0 5px;
            font-weight: 500;
        }
        #customerDetails input, #customerDetails textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: inherit;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">StyledByLade</div>
        <nav>
            <a href="index.html">HOME</a>
            <a href="shop.html">SHOP</a>
            <a href="cart.html" class="active">CART <span class="cart-count" id="cartCount">0</span></a>
        </nav>
    </header>

    <section class="section">
        <p class="section-tag">✦ Your Cart ✦</p>
        <h2>Shopping Cart</h2>
        
        <div id="cartItems" class="cart-items"></div>
        
        <div class="cart-total">
            <strong>Total: <span id="total">₦0</span></strong>
        </div>

        <!-- Delivery Form -->
        <div id="customerDetails" style="display: none;">
            <h3 style="margin-bottom: 1.5rem; text-align:center;">Delivery Information</h3>
            <form id="deliveryForm">
                <label>Full Name *</label>
                <input type="text" id="fullName" placeholder="e.g. Ada Johnson" required>

                <label>Phone Number *</label>
                <input type="tel" id="phoneNumber" placeholder="080xxxxxxxx" required>

                <label>Delivery Address *</label>
                <textarea id="address" placeholder="Full address including landmark" rows="3" required></textarea>

                <label>Additional Notes (Optional)</label>
                <textarea id="notes" placeholder="Preferred delivery date, special instructions..." rows="2"></textarea>

                <button type="button" onclick="proceedToWhatsApp()" class="btn-gold" style="width:100%; margin-top:20px; padding:16px; font-size:1.1rem;">
                    Send Order to WhatsApp
                </button>
            </form>
        </div>

        <div style="text-align:center; margin: 2rem 0;">
            <button onclick="showDeliveryForm()" class="btn-gold" style="padding:1rem 3rem; font-size:1.1rem;">
                Checkout via WhatsApp
            </button>
            <button onclick="clearCart()" style="margin-left:1rem; background:#ccc; color:#333; padding:10px 20px;">Clear Cart</button>
        </div>
    </section>

    <footer>
        © 2026 StyledByLade — All Rights Reserved | Lagos, Nigeria<br>
        WhatsApp: <a href="https://wa.me/2348064905466">0806 490 5466</a>
        <br><small><a href="admin.html" style="color:#aaa; font-size:0.75rem; text-decoration:none; opacity:0.6;">👤</a></small>
    </footer>

    <script src="cart-script.js"></script>
    <script>
        renderCart();
        updateCartCount();
    </script>
</body>
</html>
