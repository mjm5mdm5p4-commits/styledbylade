<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StyledByLade | Inspiration</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">StyledByLade</div>
        <nav>
            <a href="index.html">HOME</a>
            <a href="shop.html" class="active">INSPIRATION</a>
            <a href="index.html#contact">CONTACT</a>
        </nav>
    </header>

    <section class="section">
        <p class="section-tag">✦ Styles I Can Sew ✦</p>
        <h2>Inspiration Gallery</h2>
        <p style="max-width:700px; margin:1rem auto 3rem;">These are examples of styles I can sew. Send me any of them or your own picture/idea.</p>

        <div class="products" id="inspirationGrid"></div>

        <div style="text-align:center; margin:4rem 0;">
            <button onclick="window.open('https://wa.me/2348064905466?text=Hi%20StyledByLade%2C%20I%20have%20a%20style%20I%20want%20you%20to%20sew%20for%20me', '_blank')" 
                    class="btn-gold" style="padding:1rem 3rem; font-size:1.2rem;">
                Send Your Own Style / Idea
            </button>
        </div>
    </section>

    <footer>
        © 2026 StyledByLade — All Rights Reserved | Lagos, Nigeria<br>
        WhatsApp: <a href="https://wa.me/2348064905466">0806 490 5466</a>
        <br><small><a href="admin.html" style="color:#aaa; font-size:0.75rem; text-decoration:none; opacity:0.6;">👤</a></small>
    </footer>

    <script>
        function getInspiration() {
            // Force these 5 good styles every time for now
            return [
                { id:1, name:"Teal Ankara Peplum Gown", img:"https://picsum.photos/id/1015/600/800" },
                { id:2, name:"Vibrant Multi Ankara Gown", img:"https://picsum.photos/id/1027/600/800" },
                { id:3, name:"Golden Ankara Long Dress", img:"https://picsum.photos/id/106/600/800" },
                { id:4, name:"Red Ankara Ball Gown", img:"https://picsum.photos/id/133/600/800" },
                { id:5, name:"Blue Ankara Off-Shoulder Dress", img:"https://picsum.photos/id/180/600/800" }
            ];
        }

        function renderGallery() {
            const items = getInspiration();
            const grid = document.getElementById('inspirationGrid');
            grid.innerHTML = '';

            items.forEach(item => {
                grid.innerHTML += `
                    <div class="product">
                        <img src="${item.img}" alt="${item.name}" loading="lazy">
                        <div class="product-info">
                            <h3>${item.name}</h3>
                            <button onclick="window.open('https://wa.me/2348064905466?text=Hi%20StyledByLade%2C%20I%20like%20this%20style:%20${encodeURIComponent(item.name)}', '_blank')" class="btn-cart">
                                I Want This Style
                            </button>
                        </div>
                    </div>`;
            });
        }

        renderGallery();
    </script>
</body>
</html>
