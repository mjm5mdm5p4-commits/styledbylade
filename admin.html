<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Poppins',sans-serif; background:#0a0a0a; color:white; min-height:100vh; }

#loginScreen {
  display:flex; align-items:center; justify-content:center;
  min-height:100vh; background:#0a0a0a;
}
.login-box {
  background:#111; border:1px solid #c9a84c33;
  padding:50px 40px; border-radius:4px; width:100%; max-width:380px; text-align:center;
}
.login-box h2 { font-family:'Playfair Display',serif; color:#c9a84c; margin-bottom:8px; font-size:28px; }
.login-box p { color:#666; font-size:13px; margin-bottom:30px; }
.login-box input {
  width:100%; padding:14px; margin:8px 0;
  background:#1a1a1a; border:1px solid #333; color:white;
  font-family:'Poppins',sans-serif; font-size:14px; border-radius:2px; outline:none;
}
.login-box input:focus { border-color:#c9a84c; }
.btn-login {
  width:100%; padding:14px; background:#c9a84c; color:#000;
  border:none; font-weight:700; font-size:14px; letter-spacing:2px;
  text-transform:uppercase; border-radius:2px; cursor:pointer; margin-top:10px;
}
.btn-login:hover { background:#f0d080; }
.login-error { color:#e55; font-size:13px; margin-top:10px; display:none; }

#dashboard { display:none; }

header {
  background:#111; border-bottom:1px solid #c9a84c33;
  padding:18px 30px; display:flex; justify-content:space-between; align-items:center;
}
.logo { font-family:'Playfair Display',serif; color:#c9a84c; font-size:20px; }
.logout-btn {
  background:transparent; border:1px solid #c9a84c33; color:#c9a84c;
  padding:8px 18px; font-size:12px; letter-spacing:1px; border-radius:2px; cursor:pointer;
}
.logout-btn:hover { background:#c9a84c; color:#000; }

.tabs {
  display:flex; background:#111; border-bottom:1px solid #1e1e1e; padding:0 30px;
}
.tab {
  padding:16px 24px; font-size:13px; letter-spacing:1px; text-transform:uppercase;
  color:#666; cursor:pointer; border-bottom:2px solid transparent; transition:all 0.2s;
}
.tab.active { color:#c9a84c; border-bottom-color:#c9a84c; }
.tab:hover { color:#c9a84c; }

.content { padding:30px; max-width:1100px; margin:0 auto; }

.stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:20px; margin-bottom:40px; }
.stat-card {
  background:#111; border:1px solid #1e1e1e; border-radius:4px; padding:25px; text-align:center;
}
.stat-card .num { font-family:'Playfair Display',serif; font-size:36px; color:#c9a84c; }
.stat-card .label { font-size:12px; color:#666; letter-spacing:2px; text-transform:uppercase; margin-top:5px; }

.panel { background:#111; border:1px solid #1e1e1e; border-radius:4px; padding:25px; margin-bottom:25px; }
.panel h3 { font-family:'Playfair Display',serif; color:#c9a84c; margin-bottom:20px; font-size:20px; }

.form-row { display:grid; grid-template-columns:1fr 1fr; gap:15px; }
@media(max-width:600px){ .form-row { grid-template-columns:1fr; } }
.form-group { margin-bottom:15px; }
.form-group label { font-size:12px; color:#888; letter-spacing:1px; text-transform:uppercase; display:block; margin-bottom:6px; }
.form-group input {
  width:100%; padding:12px; background:#1a1a1a; border:1px solid #333;
  color:white; font-family:'Poppins',sans-serif; font-size:14px; border-radius:2px; outline:none;
}
.form-group input:focus { border-color:#c9a84c; }

.btn-add {
  background:#c9a84c; color:#000; border:none; padding:12px 25px;
  font-weight:700; font-size:13px; letter-spacing:1px; text-transform:uppercase;
  border-radius:2px; cursor:pointer;
}
.btn-add:hover { background:#f0d080; }
.btn-danger {
  background:transparent; color:#e55; border:1px solid #e55;
  padding:6px 14px; font-size:11px; border-radius:2px; cursor:pointer; letter-spacing:1px;
}
.btn-danger:hover { background:#e55; color:white; }

.product-item {
  display:flex; align-items:center; gap:15px;
  border-bottom:1px solid #1e1e1e; padding:15px 0;
}
.product-item:last-child { border-bottom:none; }
.product-item img { width:70px; height:70px; object-fit:cover; border-radius:2px; }
.product-item .info { flex:1; }
.product-item .info h4 { font-size:15px; margin-bottom:4px; }
.product-item .info p { font-size:13px; color:#c9a84c; }

.order-card {
  background:#1a1a1a; border-radius:4px; padding:20px; margin-bottom:15px;
}
.order-card .order-header { display:flex; justify-content:space-between; margin-bottom:10px; }
.order-card .order-header h4 { font-size:15px; }
.order-card .order-header span { font-size:12px; color:#666; }
.order-card p { font-size:13px; color:#aaa; margin:3px 0; }
.order-card .order-total { color:#c9a84c; font-weight:600; margin-top:10px; font-size:15px; }
.empty-msg { color:#555; text-align:center; padding:40px 0; font-size:14px; }

#adminToast {
  display:none; position:fixed; bottom:30px; left:50%; transform:translateX(-50%);
  background:#c9a84c; color:#000; padding:12px 25px; border-radius:2px;
  font-weight:700; font-size:13px; z-index:9999; letter-spacing:1px;
}

.tab-content { display:none; }
.tab-content.active { display:block; }
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-box">
    <h2>StyledByLade</h2>
    <p>Admin Access Only</p>
    <input type="text"     id="adminUser" placeholder="Username">
    <input type="password" id="adminPass" placeholder="Password">
    <button class="btn-login" onclick="doLogin()">Enter Dashboard</button>
    <p class="login-error" id="loginError">❌ Incorrect credentials</p>
  </div>
</div>

<div id="dashboard">
  <header>
    <div class="logo">StyledByLade Admin</div>
    <button class="logout-btn" onclick="doLogout()">Logout</button>
  </header>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('products', this)">Products</div>
    <div class="tab" onclick="switchTab('orders', this)">Orders</div>
  </div>

  <div class="content">
    <div class="stats">
      <div class="stat-card">
        <div class="num" id="statProducts">0</div>
        <div class="label">Products</div>
      </div>
      <div class="stat-card">
        <div class="num" id="statOrders">0</div>
        <div class="label">Orders</div>
      </div>
      <div class="stat-card">
        <div class="num" id="statRevenue">₦0</div>
        <div class="label">Total Revenue</div>
      </div>
    </div>

    <div class="tab-content active" id="tab-products">
      <div class="panel">
        <h3>Add New Product</h3>
        <div class="form-row">
          <div class="form-group">
            <label>Product Name</label>
            <input id="newName" placeholder="e.g. Luxury Gown">
          </div>
          <div class="form-group">
            <label>Price (₦)</label>
            <input id="newPrice" type="number" placeholder="e.g. 25000">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Image URL</label>
            <input id="newImg" placeholder="https://... or leave blank">
          </div>
          <div class="form-group">
            <label>Badge (optional)</label>
            <input id="newBadge" placeholder="e.g. New, Bestseller, Sale">
          </div>
        </div>
        <button class="btn-add" onclick="addProduct()">+ Add Product</button>
      </div>

      <div class="panel">
        <h3>Current Products</h3>
        <div id="productList"></div>
      </div>
    </div>

    <div class="tab-content" id="tab-orders">
      <div class="panel">
        <h3>Customer Orders</h3>
        <div id="ordersList"></div>
      </div>
    </div>
  </div>
</div>

<div id="adminToast"></div>

<script>
  const ADMIN_USER = "Styledbylade";
  const ADMIN_PASS = "styledbylade2026";

  function doLogin() {
    const u = document.getElementById('adminUser').value;
    const p = document.getElementById('adminPass').value;
    if (u === ADMIN_USER && p === ADMIN_PASS) {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('dashboard').style.display   = 'block';
      loadDashboard();
    } else {
      document.getElementById('loginError').style.display = 'block';
    }
  }

  document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

  function doLogout() {
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('dashboard').style.display   = 'none';
    document.getElementById('adminUser').value = '';
    document.getElementById('adminPass').value = '';
  }

  function switchTab(name, el) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.getElementById('tab-' + name).classList.add('active');
    el.classList.add('active');
  }

  const defaultProducts = [
    { id:1, name:"Luxury Gown",   price:25000, img:"https://images.unsplash.com/photo-1496747611176-843222e1e57c", badge:"Bestseller" },
    { id:2, name:"Elegant Dress", price:18000, img:"https://images.unsplash.com/photo-1483985988355-763728e1935b", badge:"New" },
    { id:3, name:"Custom Outfit", price:35000, img:"https://images.unsplash.com/photo-1515886657613-9f3515b0c78f", badge:"Premium" }
  ];

  function getProducts() {
    const s = localStorage.getItem('sbl_products');
    return s ? JSON.parse(s) : defaultProducts;
  }
  function saveProducts(p) { localStorage.setItem('sbl_products', JSON.stringify(p)); }

  function renderProductList() {
    const products = getProducts();
    const list = document.getElementById('productList');
    if (products.length === 0) {
      list.innerHTML = '<p class="empty-msg">No products yet. Add one above!</p>';
      return;
    }
    list.innerHTML = '';
    products.forEach((p, i) => {
      list.innerHTML += `
        <div class="product-item">
          <img src="${p.img}" onerror="this.src='https://images.unsplash.com/photo-1515886657613-9f3515b0c78f'">
          <div class="info">
            <h4>${p.name} ${p.badge ? `<small style="color:#c9a84c;font-size:11px">[${p.badge}]</small>` : ''}</h4>
            <p>₦${p.price.toLocaleString()}</p>
          </div>
          <button class="btn-danger" onclick="removeProduct(${i})">Remove</button>
        </div>`;
    });
  }

  function addProduct() {
    const name  = document.getElementById('newName').value.trim();
    const price = parseFloat(document.getElementById('newPrice').value);
    const img   = document.getElementById('newImg').value.trim() || 'https://images.unsplash.com/photo-1515886657613-9f3515b0c78f';
    const badge = document.getElementById('newBadge').value.trim();
    if (!name || !price) { showAdminToast('Please enter name and price!'); return; }
    const products = getProducts();
    products.push({ id: Date.now(), name, price, img, badge });
    saveProducts(products);
    renderProductList();
    updateStats();
    document.getElementById('newName').value  = '';
    document.getElementById('newPrice').value = '';
    document.getElementById('newImg').value   = '';
    document.getElementById('newBadge').value = '';
    showAdminToast('✦ Product added!');
  }

  function removeProduct(i) {
    if (!confirm('Remove this product?')) return;
    const products = getProducts();
    products.splice(i, 1);
    saveProducts(products);
    renderProductList();
    updateStats();
    showAdminToast('Product removed!');
  }

  function renderOrders() {
    const orders = JSON.parse(localStorage.getItem('sbl_orders') || '[]');
    const list   = document.getElementById('ordersList');
    if (orders.length === 0) {
      list.innerHTML = '<p class="empty-msg">No orders yet.</p>';
      return;
    }
    list.innerHTML = '';
    [...orders].reverse().forEach(o => {
      const items = o.items.map(p => `${p.name} (₦${p.price.toLocaleString()})`).join(', ');
      list.innerHTML += `
        <div class="order-card">
          <div class="order-header">
            <h4>👤 ${o.name}</h4>
            <span>${o.date}</span>
          </div>
          <p>📞 ${o.phone}</p>
          <p>📍 ${o.address}</p>
          <p>🛍 ${items}</p>
          <p class="order-total">Total: ₦${o.total.toLocaleString()}</p>
        </div>`;
    });
  }

  function updateStats() {
    const products = getProducts();
    const orders   = JSON.parse(localStorage.getItem('sbl_orders') || '[]');
    const revenue  = orders.reduce((sum, o) => sum + o.total, 0);
    document.getElementById('statProducts').textContent = products.length;
    document.getElementById('statOrders').textContent   = orders.length;
    document.getElementById('statRevenue').textContent  = '₦' + revenue.toLocaleString();
  }

  function loadDashboard() {
    renderProductList();
    renderOrders();
    updateStats();
  }

  function showAdminToast(msg) {
    const t = document.getElementById('adminToast');
    t.textContent   = msg;
    t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 2500);
  }
</script>
</body>
</html>
