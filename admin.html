<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StyledByLade | Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-container { max-width: 1000px; margin: 2rem auto; padding: 2rem; }
        .product-row { display: flex; align-items: center; gap: 1rem; padding: 1rem; background: white; margin-bottom: 1rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .admin-form { background: #f8f1e9; padding: 2rem; border-radius: 12px; margin-bottom: 3rem; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; }
        #admin-content { display: none; }
    </style>
</head>
<body>
    <header>
        <div class="logo">StyledByLade <span style="font-size:0.8rem; color:#666;">👤 Admin</span></div>
        <nav>
            <a href="index.html">HOME</a>
            <a href="shop.html">INSPIRATION</a>
        </nav>
    </header>

    <section class="admin-container">
        <h2 style="text-align:center; margin-bottom:2rem;">🔧 Add New Inspiration</h2>

        <div id="password-screen">
            <div style="max-width:400px; margin:4rem auto; text-align:center; background:white; padding:3rem; border-radius:12px;">
                <h3>Admin Access</h3>
                <input type="password" id="adminPassword" placeholder="Password" style="width:100%; padding:12px; margin:15px 0;">
                <button onclick="checkPassword()" class="btn-gold" style="width:100%;">Unlock</button>
            </div>
        </div>

        <div id="admin-content">
            <div class="admin-form">
                <h3>Add New Style</h3>
                <input type="text" id="newName" placeholder="Style Name e.g. Teal Ankara Gown">
                <input type="text" id="newImg" placeholder="Image URL">
                <button onclick="addProduct()" class="btn-gold" style="width:100%; margin-top:1rem;">Add to Gallery</button>
            </div>

            <h3>Current Styles (Click × to delete)</h3>
            <div id="adminProductList"></div>
        </div>
    </section>

    <footer>
        © 2026 StyledByLade — All Rights Reserved | Lagos, Nigeria
    </footer>

    <script>
        const CORRECT_PASSWORD = "Lade@2026";

        function checkPassword() {
            if (document.getElementById('adminPassword').value === CORRECT_PASSWORD) {
                document.getElementById('password-screen').style.display = 'none';
                document.getElementById('admin-content').style.display = 'block';
                renderAdminProducts();
            } else {
                alert("Wrong password");
            }
        }

        function getProducts() {
            return JSON.parse(localStorage.getItem('sbl_products')) || [];
        }

        function saveProducts(products) {
            localStorage.setItem('sbl_products', JSON.stringify(products));
            renderAdminProducts();
        }

        function addProduct() {
            const name = document.getElementById('newName').value.trim();
            const img = document.getElementById('newImg').value.trim();

            if (!name || !img) {
                alert("Both name and image URL are required");
                return;
            }

            const products = getProducts();
            const newId = Date.now(); // Better unique ID

            products.push({ id: newId, name, img });
            saveProducts(products);

            document.getElementById('newName').value = '';
            document.getElementById('newImg').value = '';
            alert("✅ Style added successfully!");
        }

        function deleteProduct(id) {
            if (!confirm("Delete this style permanently?")) return;
            let products = getProducts();
            products = products.filter(p => p.id !== id);
            saveProducts(products);
        }

        function renderAdminProducts() {
            const products = getProducts();
            const container = document.getElementById('adminProductList');
            container.innerHTML = products.length === 0 ? "<p>No styles yet. Add some above.</p>" : "";

            products.forEach(p => {
                container.innerHTML += `
                    <div class="product-row">
                        <img src="${p.img}" style="width:80px; height:80px; object-fit:cover; border-radius:8px;">
                        <div style="flex:1;"><strong>${p.name}</strong></div>
                        <button onclick="deleteProduct(${p.id})" style="color:red; font-size:1.8rem; background:none; border:none; cursor:pointer;">×</button>
                    </div>`;
            });
        }

        // Enter key support
        document.getElementById('adminPassword').addEventListener('keypress', e => {
            if (e.key === 'Enter') checkPassword();
        });
    </script>
</body>
</html>
