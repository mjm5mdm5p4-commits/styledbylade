<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StyledByLade | Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-container { max-width: 1000px; margin: 2rem auto; padding: 2rem; }
        .product-row { 
            display: flex; 
            align-items: center; 
            gap: 1rem; 
            padding: 1rem; 
            background: white; 
            margin-bottom: 1rem; 
            border-radius: 8px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .admin-form { 
            background: #f8f1e9; 
            padding: 2rem; 
            border-radius: 12px; 
            margin-bottom: 3rem; 
        }
        input, select, textarea { 
            width: 100%; 
            padding: 12px; 
            margin: 8px 0; 
            border: 1px solid #ddd; 
            border-radius: 8px; 
        }
        #admin-content { display: none; }
    </style>
</head>
<body>
    <header>
        <div class="logo">StyledByLade <span style="font-size:0.8rem; color:#666;">👤 Admin</span></div>
        <nav>
            <a href="index.html">HOME</a>
            <a href="shop.html">SHOP</a>
            <a href="cart.html">CART</a>
        </nav>
    </header>

    <section class="admin-container">
        <h2 style="text-align:center; margin-bottom:2rem;">🔧 Product Management</h2>

        <!-- Password Screen -->
        <div id="password-screen">
            <div style="max-width:400px; margin:4rem auto; text-align:center; background:white; padding:3rem; border-radius:12px; box-shadow:0 5px 20px rgba(0,0,0,0.1);">
                <h3>Admin Access</h3>
                <p>Enter Password</p>
                <input type="password" id="adminPassword" placeholder="Password" style="width:100%; padding:12px; margin:15px 0;">
                <button onclick="checkPassword()" class="btn-gold" style="width:100%;">Unlock Admin Panel</button>
            </div>
        </div>

        <!-- Main Admin Content (hidden until password correct) -->
        <div id="admin-content">
            <!-- Add New Product -->
            <div class="admin-form">
                <h3>Add New Product</h3>
                <input type="text" id="newName" placeholder="Product Name" required>
                <input type="number" id="newPrice" placeholder="Price (e.g. 450000)" required>
                <input type="text" id="newImg" placeholder="Image URL" required>
                <select id="newCategory">
                    <option value="bridal">Bridal</option>
                    <option value="evening">Evening</option>
                </select>
                <input type="text" id="newBadge" placeholder="Badge (Bestseller, New, Premium)">
                
                <button onclick="addProduct()" class="btn-gold" style="width:100%; margin-top:1rem;">Add Product</button>
            </div>

            <!-- Current Products -->
            <h3>Current Products</h3>
            <div id="adminProductList"></div>
        </div>
    </section>

    <footer>
        © 2026 StyledByLade — All Rights Reserved | Lagos, Nigeria
    </footer>

    <script>
        const CORRECT_PASSWORD = "Lade@2026";

        function checkPassword() {
            const entered = document.getElementById('adminPassword').value;
            if (entered === CORRECT_PASSWORD) {
                document.getElementById('password-screen').style.display = 'none';
                document.getElementById('admin-content').style.display = 'block';
                renderAdminProducts();
            } else {
                alert("Incorrect password! Try again.");
                document.getElementById('adminPassword').value = '';
            }
        }

        function getProducts() {
            return JSON.parse(localStorage.getItem('sbl_products')) || [
                { id:1, name:"Emerald Luxury Gown", price:450000, img:"https://picsum.photos/id/1015/600/800", badge:"Bestseller", category:"bridal" },
                { id:2, name:"Crimson Evening Dress", price:380000, img:"https://picsum.photos/id/1027/600/800", badge:"New", category:"evening" },
                { id:3, name:"Ivory Bridal Set", price:520000, img:"https://picsum.photos/id/106/600/800", badge:"Premium", category:"bridal" }
            ];
        }

        function saveProducts(products) {
            localStorage.setItem('sbl_products', JSON.stringify(products));
            renderAdminProducts();
        }

        function addProduct() {
            const name = document.getElementById('newName').value.trim();
            const price = parseInt(document.getElementById('newPrice').value);
            const img = document.getElementById('newImg').value.trim();
            const category = document.getElementById('newCategory').value;
            const badge = document.getElementById('newBadge').value.trim();

            if (!name || !price || !img) {
                alert("Name, Price and Image URL are required");
                return;
            }

            const products = getProducts();
            const newId = Math.max(0, ...products.map(p => p.id)) + 1;

            products.push({ id: newId, name, price, img, badge, category });
            saveProducts(products);

            // Clear form
            document.getElementById('newName').value = '';
            document.getElementById('newPrice').value = '';
            document.getElementById('newImg').value = '';
            document.getElementById('newBadge').value = '';
            alert("✅ Product added successfully!");
        }

        function deleteProduct(id) {
            if (!confirm("Delete this product permanently?")) return;
            let products = getProducts();
            products = products.filter(p => p.id !== id);
            saveProducts(products);
        }

        function renderAdminProducts() {
            const products = getProducts();
            const container = document.getElementById('adminProductList');
            container.innerHTML = '';

            products.forEach(p => {
                container.innerHTML += `
                    <div class="product-row">
                        <img src="${p.img}" style="width:80px; height:80px; object-fit:cover; border-radius:8px;">
                        <div style="flex:1;">
                            <strong>${p.name}</strong><br>
                            ₦${p.price.toLocaleString()} • ${p.category}
                            ${p.badge ? `<span style="background:#d4af37; padding:2px 8px; border-radius:12px; font-size:0.8rem;">${p.badge}</span>` : ''}
                        </div>
                        <button onclick="deleteProduct(${p.id})" style="color:red; background:none; border:none; font-size:1.5rem; cursor:pointer;">×</button>
                    </div>`;
            });
        }

        // Allow pressing Enter in password field
        document.getElementById('adminPassword').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') checkPassword();
        });
    </script>
</body>
</html>
