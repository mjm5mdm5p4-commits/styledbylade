<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STYLEDBYLADE - Fashion That Never Fades</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500&display=swap');
        
        :root {
            --burgundy: #4A0D1A;
            --gold: #D4AF37;
            --dark: #111111;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0a;
            color: #eee;
            line-height: 1.6;
        }
        
        header {
            background: rgba(10,10,10,0.95);
            position: fixed;
            width: 100%;
            z-index: 1000;
            padding: 1.2rem 5%;
            border-bottom: 1px solid rgba(212,175,55,0.2);
        }
        
        nav {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            display: flex;
            align-items: center;
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            color: var(--gold);
        }
        
        .logo img { height: 55px; margin-right: 10px; }
        
        .nav-links {
            display: flex;
            gap: 2.5rem;
            list-style: none;
        }
        
        .nav-links a {
            color: #ddd;
            text-decoration: none;
            font-weight: 400;
            transition: color 0.3s;
        }
        
        .nav-links a:hover { color: var(--gold); }
        
        .cart {
            cursor: pointer;
            font-size: 1.5rem;
        }
        
        .hero {
            height: 100vh;
            background: linear-gradient(rgba(74,13,26,0.75), rgba(74,13,26,0.75)), url('https://picsum.photos/id/1015/2000/1200') center/cover;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
        }
        
        .hero-content h1 {
            font-family: 'Playfair Display', serif;
            font-size: 5rem;
            color: var(--gold);
            margin-bottom: 1rem;
        }
        
        .hero-content p {
            font-size: 1.4rem;
            max-width: 600px;
            margin: 0 auto 2rem;
        }
        
        .btn {
            background: var(--gold);
            color: var(--burgundy);
            padding: 14px 45px;
            border: none;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn:hover {
            background: white;
            transform: scale(1.03);
        }
        
        section {
            padding: 100px 5%;
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .section-title {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            text-align: center;
            margin-bottom: 4rem;
            color: var(--gold);
        }
        
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2rem;
        }
        
        .product-card {
            position: relative;
            overflow: hidden;
            border-radius: 8px;
        }
        
        .product-card img {
            width: 100%;
            height: 520px;
            object-fit: cover;
            transition: transform 0.5s;
        }
        
        .product-card:hover img {
            transform: scale(1.08);
        }
        
        .product-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.9));
            padding: 2rem 1.5rem 1.5rem;
            color: white;
        }
        
        footer {
            background: var(--dark);
            padding: 4rem 5% 2rem;
            text-align: center;
            border-top: 1px solid #333;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <img src="https://i.imgur.com/9DZvD.png" alt="STYLEDBYLADE">
                STYLEDBYLADE
            </div>
            <ul class="nav-links">
                <li><a href="#shop">SHOP</a></li>
                <li><a href="#collections">COLLECTIONS</a></li>
                <li><a href="#about">ABOUT</a></li>
            </ul>
            <div class="cart" onclick="toggleCart()">🛒 <span id="cart-count" style="background:var(--gold);color:#4A0D1A;padding:2px 7px;border-radius:50%;font-size:0.8rem;">0</span></div>
        </nav>
    </header>

    <!-- Hero -->
    <section class="hero">
        <div class="hero-content">
            <img src="https://i.imgur.com/9DZvD.png" style="max-width:380px;margin-bottom:2rem;" alt="Logo">
            <h1>Fashion That Never Fades</h1>
            <p>Timeless elegance. Nigerian luxury.</p>
            <button class="btn" onclick="document.getElementById('shop').scrollIntoView({behavior:'smooth'})">EXPLORE COLLECTION</button>
        </div>
    </section>

    <!-- Shop -->
    <section id="shop">
        <h2 class="section-title">Signature Collection</h2>
        <div class="products-grid" id="products"></div>
    </section>

    <!-- Cart Modal (same as before) -->
    <div id="cart-modal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:2000;align-items:center;justify-content:center;">
        <div style="background:#1a1a1a;width:90%;max-width:500px;padding:2rem;border-radius:8px;max-height:85vh;overflow:auto;color:white;">
            <h2>Your Cart (<span id="modal-cart-count">0</span>)</h2>
            <div id="cart-items" style="margin:1.5rem 0;"></div>
            <div id="cart-total" style="font-size:1.4rem;text-align:right;margin:1rem 0;font-weight:bold;">Total: ₦0</div>
            <button onclick="checkout()" class="btn" style="width:100%;background:var(--gold);color:#4A0D1A;">ORDER VIA WHATSAPP</button>
            <button onclick="toggleCart()" style="width:100%;margin-top:10px;padding:14px;background:#333;border:none;color:white;">Close</button>
        </div>
    </div>

    <script>
        let cart = [];
        const whatsappNumber = "2348064905466";

        const products = [
            {id:1, name:"Emerald Silk Gown", price:85000, img:"https://picsum.photos/id/1015/800/1000", desc:"Elegant silk gown"},
            {id:2, name:"Modern Ankara Suit", price:65000, img:"https://picsum.photos/id/1027/800/1000", desc:"Bold contemporary Ankara"},
            {id:3, name:"Velvet Luxe Set", price:72000, img:"https://picsum.photos/id/106/800/1000", desc:"Rich velvet evening set"},
            {id:4, name:"Royal Brocade Dress", price:78000, img:"https://picsum.photos/id/201/800/1000", desc:"Timeless brocade"}
        ];

        function renderProducts() {
            const container = document.getElementById('products');
            container.innerHTML = products.map(p => `
                <div class="product-card" onclick="quickAddToCart(${p.id})">
                    <img src="${p.img}" alt="${p.name}">
                    <div class="product-overlay">
                        <h3>${p.name}</h3>
                        <p style="margin:8px 0;">${p.desc}</p>
                        <div style="color:var(--gold);font-weight:600;">₦${p.price.toLocaleString()}</div>
                    </div>
                </div>
            `).join('');
        }

        function quickAddToCart(id) {
            const product = products.find(p => p.id === id);
            if (product) {
                cart.push({...product, size: "M"});
                document.getElementById('cart-count').textContent = cart.length;
                alert(`${product.name} added to cart!`);
            }
        }

        function toggleCart() {
            const modal = document.getElementById('cart-modal');
            modal.style.display = (modal.style.display === 'flex') ? 'none' : 'flex';
            if (modal.style.display === 'flex') renderCart();
        }

        function renderCart() {
            let html = '';
            let total = 0;
            cart.forEach((item, i) => {
                total += item.price;
                html += `<div style="display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #333;">
                    <div>${item.name} <small>(${item.size})</small></div>
                    <div>₦${item.price.toLocaleString()}</div>
                </div>`;
            });
            document.getElementById('cart-items').innerHTML = html || '<p>Your cart is empty.</p>';
            document.getElementById('cart-total').textContent = `Total: ₦${total.toLocaleString()}`;
            document.getElementById('modal-cart-count').textContent = cart.length;
        }

        function checkout() {
            if (cart.length === 0) return alert("Cart is empty!");
            
            let msg = "Hello STYLEDBYLADE!%0AI want to order:%0A%0A";
            let total = 0;
            cart.forEach(item => {
                msg += `• ${item.name} (${item.size}) - ₦${item.price.toLocaleString()}%0A`;
                total += item.price;
            });
            msg += `%0ATotal: ₦${total.toLocaleString()}%0A%0ADelivery Address: [Enter address]%0APhone: [Your number]%0A`;
            
            window.open(`https://wa.me/${whatsappNumber}?text=${msg}`, '_blank');
            
            setTimeout(() => {
                cart = [];
                document.getElementById('cart-count').textContent = '0';
                toggleCart();
            }, 1500);
        }

        // Init
        renderProducts();
    </script>
</body>
</html>
